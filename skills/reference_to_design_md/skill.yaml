id: reference_to_design_md
name: Reference to DESIGN.md
version: 0.1.0
description: Retrieve evidence-backed design references, extract transferable principles, and generate a project DESIGN.md.
inputs:
  - project
  - artifact_type
  - audience
  - primary_goal
  - traits
  - reference_queries
